name: RPC Full Matrix Verification

on:
  workflow_dispatch:

jobs:
  rpc-full-matrix:
    runs-on: ubuntu-latest
    env:
      EXECUTION_AUTHORIZATION: '0'
      AUTHORIZATION_STATE: LOCKED
      LIVE_SIGNING: 'false'
      BROADCAST_ENABLED: 'false'
      TRANSACTION_SIGNED: 'false'
      TRANSACTION_BROADCAST: 'false'
      LIVE_EXECUTION_READY: 'false'
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
      AVAX_RPC_URL: ${{ secrets.AVAX_RPC_URL }}
      CRONOS_RPC_URL: ${{ secrets.CRONOS_RPC_URL }}
      SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require all seven RPC endpoints
        shell: bash
        run: |
          set -euo pipefail
          required=(ETH_RPC_URL BSC_RPC_URL BASE_RPC_URL ARBITRUM_RPC_URL AVAX_RPC_URL CRONOS_RPC_URL SONIC_RPC_URL)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "MISSING_RPC_SECRET=$name"
              exit 1
            fi
          done
          echo "RPC_SECRET_COUNT=7"

      - name: Verify locked state
        run: node scripts/verify-locked-state.mjs

      - name: Run strict seven-network read-only matrix
        run: node scripts/rpc-request-matrix.mjs

      - name: Verify locked state again
        run: node scripts/verify-locked-state.mjs
